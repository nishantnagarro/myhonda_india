# SonarQube Project Configuration for MyHonda India Mobile
sonar.projectKey=com.honda.india:myhonda-mobile
sonar.projectName=MyHonda India Mobile
sonar.projectVersion=1.0.0

# Source and test directories
sonar.sources=src,app
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx
sonar.exclusions=**/node_modules/**,**/.expo/**,**/dist/**,**/assets/**,**/*.d.ts

# Encoding and Language
sonar.sourceEncoding=UTF-8
sonar.typescript.tsconfigPath=tsconfig.json

# Quality Gates and Metrics
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,src/core/services.ts,app/**
sonar.cpd.exclusions=**/*.test.ts,**/*.test.tsx
